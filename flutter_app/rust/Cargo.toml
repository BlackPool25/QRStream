[package]
name = "qr_transfer_rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
raptorq = "=2.0.1"
flutter_rust_bridge = "=2.12.0"
# QR decoding for the receive path. `bundled` compiles the C++ core via `cc`
# (needs a C++17 compiler, e.g. g++/clang++ on PATH) — see zxing_cpp README.
zxing-cpp = { version = "=0.5.3", default-features = false, features = ["bundled"] }

[dev-dependencies]

# RaptorQ's GF(256) encode/decode is the hot loop in the round-trip tests; at
# opt-level 0 it dominates the suite (~150 s for the 1 MiB loss matrix). Compile
# only the codec optimized in dev/test builds so `cargo test` stays fast with no
# command change; the test crate itself keeps debug assertions.
[profile.dev.package.raptorq]
opt-level = 3
