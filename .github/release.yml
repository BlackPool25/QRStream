# Label-driven release notes (used when the release workflow creates a
# GitHub Release with generate_release_notes: true).
changelog:
  exclude:
    labels: [ignore-for-release]
  categories:
    - title: Breaking Changes 🛠
      labels: [breaking-change]
    - title: Features 🎉
      labels: [enhancement]
    - title: Bug Fixes 🐛
      labels: [bug]
    - title: Dependencies
      labels: [dependencies]
    - title: Other Changes
      labels: ['*']
