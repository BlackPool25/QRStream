name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run tsc
      - run: npm run vitest run
      - run: npm run soak
      # Perf budgets are machine-tolerant; run after the soak so numbers are
      # steady-state. The e2e perf spec is excluded: it needs a browser + build.
      - run: npm run perf
      - run: npm run build
