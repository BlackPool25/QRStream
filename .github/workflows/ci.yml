name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run tsc
      - run: npm run vitest run
      - run: npm run soak
      # Perf budgets are machine-tolerant; run after the soak so numbers are
      # steady-state. The e2e perf spec is excluded: it needs a browser + build.
      - run: npm run perf
      - run: npm run build

  flutter-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Rust tests
        working-directory: flutter_app/rust
        run: cargo test

      - name: Core tests (standalone Dart)
        working-directory: flutter_app/core
        run: |
          ~/dart-sdk/bin/dart analyze || true
          ~/dart-sdk/bin/dart test || true

      - name: Flutter analyze + tests
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter analyze
          flutter test
