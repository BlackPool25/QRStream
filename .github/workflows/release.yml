name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
          key: cargo-${{ runner.os }}-${{ hashFiles('flutter_app/rust/Cargo.lock') }}

      # android/, linux/ and windows/ are gitignored; regenerate the
      # scaffolding, then apply the committed templates so the release build is
      # reproducible from a fresh clone (the Linux templates carry the QRStream
      # launcher icon + the qrstream/window fullscreen channel).
      - name: Generate platform scaffolding
        working-directory: flutter_app
        run: |
          flutter create --platforms=android,linux --org com.qrtransfer --project-name qr_data_transfer .
          cp android_templates/MainActivity.kt android/app/src/main/kotlin/com/qrtransfer/qr_data_transfer/MainActivity.kt
          cp android_templates/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android_templates/build.gradle.kts.template android/app/build.gradle.kts
          cp android_templates/proguard-rules.pro android/app/proguard-rules.pro
          cp linux_templates/CMakeLists.txt linux/CMakeLists.txt
          cp linux_templates/icon.png linux/runner/icon.png
          cp linux_templates/my_application.cc linux/runner/my_application.cc

      # The launcher icon (adaptive + legacy mipmaps) is generated, not
      # committed (res/ lives under the gitignored android/ tree). A fresh
      # build otherwise ships the default Flutter icon — run the LOGO-based
      # generator so the release APK shows the brand logo (generate.dart makes
      # a generic QR instead).
      - name: Install ImageMagick for the launcher icon generator
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Generate launcher icon
        working-directory: flutter_app
        run: dart android_templates/icon/generate_logo.dart

      - name: Rust release codec (Linux dylib)
        working-directory: flutter_app/rust
        run: cargo build --release

      - name: Build Android codec (.so)
        working-directory: flutter_app
        run: bash scripts/build-android-so.sh

      - name: Build APK
        working-directory: flutter_app
        run: flutter build apk --release --target-platform android-arm64

      # Flutter writes the canonical app-release.apk; rename it to carry the
      # product name + version (qrstream-<tag>.apk) for the release.
      - name: Rename APK
        run: |
          TAG="${{ github.ref_name }}"
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk \
             flutter_app/build/app/outputs/flutter-apk/qrstream-${TAG#v}.apk

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Build Linux bundle
        working-directory: flutter_app
        run: flutter build linux --release

      - name: Package Linux tarball
        working-directory: flutter_app/build/linux/x64/release
        run: tar -czf qrstream-linux-x64.tar.gz bundle

      - name: Install RPM build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm patchelf

      - name: Build RPM
        run: bash packaging/linux/build-rpm.sh

      - name: Checksums
        working-directory: flutter_app
        run: |
          sha256sum build/app/outputs/flutter-apk/qrstream-*.apk \
                   build/linux/x64/release/qrstream-linux-x64.tar.gz > SHA256SUMS
          sha256sum ../packaging/linux/rpmbuild/RPMS/x86_64/*.rpm >> SHA256SUMS

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v3
        with:
          name: QRStream ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          files: |
            flutter_app/build/app/outputs/flutter-apk/qrstream-*.apk
            flutter_app/build/linux/x64/release/qrstream-linux-x64.tar.gz
            flutter_app/SHA256SUMS
            packaging/linux/rpmbuild/RPMS/x86_64/*.rpm
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Windows native build. The app is send-only on desktop (the camera plugin is
  # Android-only), mirroring Linux. Flutter requires a Windows host to build
  # Windows binaries (no cross-compilation — a Linux/Docker host cannot produce
  # a Windows Flutter build), so this job runs on windows-latest.
  build-windows:
    runs-on: windows-latest
    needs: build-and-release
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # windows/ is gitignored like android/ and linux/; regenerate the
      # scaffolding and apply the committed template (the CMakeLists carries
      # the MSVC coroutine-silence define newer plugin toolchains need).
      - name: Generate Windows scaffolding
        working-directory: flutter_app
        run: |
          flutter create --platforms=windows --org com.qrtransfer --project-name qr_data_transfer .
          cp windows_templates/CMakeLists.txt windows/CMakeLists.txt
          cp windows_templates/runner/CMakeLists.txt windows/runner/CMakeLists.txt
          # flutter create scaffolds the default Flutter blue app_icon.ico;
          # overlay the brand logo so the exe embeds the QRStream icon.
          cp windows_templates/runner/resources/app_icon.ico windows/runner/resources/app_icon.ico

      - name: Rust release codec (Windows dll)
        working-directory: flutter_app/rust
        run: cargo build --release

      - name: Build Windows bundle
        working-directory: flutter_app
        run: flutter build windows --release

      # The Flutter docs require the MSVC runtime shipped app-local (the
      # msvcp140/vcruntime140 DLLs) or the exe fails to start on machines
      # without the VC++ redistributable — the released zip was missing them.
      # The DLLs are committed at packaging/windows/vc_redist/ (sourced from
      # the VS 2022+ redistributable; deterministic, no runner-layout lookup).
      - name: Copy MSVC runtime DLLs
        shell: bash
        working-directory: flutter_app/build/windows/x64/runner/Release
        run: cp "$GITHUB_WORKSPACE"/packaging/windows/vc_redist/*.dll .

      - name: Package Windows zip
        shell: bash
        working-directory: flutter_app/build/windows/x64/runner/Release
        run: |
          # The codec .dll must ship next to the exe for the FFI to find it.
          cp "$GITHUB_WORKSPACE/flutter_app/rust/target/release/qr_transfer_rust.dll" .
          powershell -Command "Compress-Archive -Path * -DestinationPath qrstream-windows-x64.zip -Force"

      # Inno Setup 6.7.1 ships pre-installed on windows-latest; ISCC compiles
      # packaging/windows/installer.iss into a signed-ready setup.exe that
      # bundles the Release dir (exe + engine DLLs + Rust codec + MSVC runtime).
      - name: Build Windows installer
        working-directory: flutter_app
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found on runner" }
          $ver = "${{ github.ref_name }}" -replace '^v'
          $release = Join-Path $env:GITHUB_WORKSPACE 'flutter_app\build\windows\x64\runner\Release'
          & $iscc "/DMyAppVersion=$ver" "/DReleaseDir=$release" ..\packaging\windows\installer.iss

      - name: Upload Windows artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: flutter_app
        run: |
          ver="${{ github.ref_name }}"; ver="${ver#v}"
          gh release upload ${{ github.ref_name }} \
            build/windows/x64/runner/Release/qrstream-windows-x64.zip \
            ../packaging/windows/output/qrstream-${ver}-windows-setup.exe --clobber
