name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
          key: cargo-${{ runner.os }}-${{ hashFiles('flutter_app/rust/Cargo.lock') }}

      # android/ and linux/ are gitignored; regenerate the scaffolding, then
      # apply the committed templates (MainActivity, manifest, gradle, R8 rules)
      # so the release build is reproducible from a fresh clone.
      - name: Generate platform scaffolding
        working-directory: flutter_app
        run: |
          flutter create --platforms=android,linux --org com.qrtransfer --project-name qr_data_transfer .
          cp android_templates/MainActivity.kt android/app/src/main/kotlin/com/qrtransfer/qr_data_transfer/MainActivity.kt
          cp android_templates/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android_templates/build.gradle.kts.template android/app/build.gradle.kts
          cp android_templates/proguard-rules.pro android/app/proguard-rules.pro

      - name: Rust release codec (Linux dylib)
        working-directory: flutter_app/rust
        run: cargo build --release

      - name: Build Android codec (.so)
        working-directory: flutter_app
        run: bash scripts/build-android-so.sh

      - name: Build APK
        working-directory: flutter_app
        run: flutter build apk --release --target-platform android-arm64

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Build Linux bundle
        working-directory: flutter_app
        run: flutter build linux --release

      - name: Package Linux tarball
        working-directory: flutter_app/build/linux/x64/release
        run: tar -czf qrstream-linux-x64.tar.gz bundle

      - name: Checksums
        working-directory: flutter_app
        run: |
          sha256sum build/app/outputs/flutter-apk/app-release.apk \
                   build/linux/x64/release/qrstream-linux-x64.tar.gz > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: QRStream ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            flutter_app/build/app/outputs/flutter-apk/app-release.apk
            flutter_app/build/linux/x64/release/qrstream-linux-x64.tar.gz
            flutter_app/SHA256SUMS
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Windows native build. The app is send-only on desktop (the camera plugin is
  # Android-only), mirroring Linux. Flutter requires a Windows host to build
  # Windows binaries, so this job runs on windows-latest.
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # windows/ is gitignored like android/ and linux/; regenerate the
      # scaffolding so the build works from a fresh clone.
      - name: Generate Windows scaffolding
        working-directory: flutter_app
        run: flutter create --platforms=windows --org com.qrtransfer --project-name qr_data_transfer .

      - name: Rust release codec (Windows dll)
        working-directory: flutter_app/rust
        run: cargo build --release

      - name: Build Windows bundle
        working-directory: flutter_app
        run: flutter build windows --release

      - name: Package Windows zip
        shell: bash
        working-directory: flutter_app/build/windows/x64/runner/Release
        run: |
          # The codec .dll must ship next to the exe for the FFI to find it.
          cp ../../../../rust/target/release/qr_transfer_rust.dll .
          powershell -Command "Compress-Archive -Path * -DestinationPath qrstream-windows-x64.zip -Force"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: qrstream-windows
          path: flutter_app/build/windows/x64/runner/Release/qrstream-windows-x64.zip

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          files: flutter_app/build/windows/x64/runner/Release/qrstream-windows-x64.zip
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
