name: diag-vcrt
on: workflow_dispatch
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate + copy MSVC CRT DLLs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          Write-Host "VS at: $vsPath"
          $redist = Get-ChildItem "$vsPath\VC\Redist\MSVC" -Directory -ErrorAction SilentlyContinue |
            Sort-Object { [version]($_.Name -replace '[^0-9.]','') } -Descending | Select-Object -First 1
          if (-not $redist) { Write-Host "NO REDIST DIR"; exit 1 }
          Write-Host "Redist: $($redist.FullName)"
          $crt = Get-ChildItem "$($redist.FullName)\x64\Microsoft.VC143.CRT" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $crt) {
            $crt = Get-ChildItem "$($redist.FullName)" -Recurse -Filter "msvcp140.dll" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Directory
          }
          Write-Host "CRT dir: $($crt.FullName)"
          New-Item -ItemType Directory -Force -Path vcrt-out | Out-Null
          Copy-Item "$($crt.FullName)\msvcp140.dll" vcrt-out\
          Copy-Item "$($crt.FullName)\vcruntime140.dll" vcrt-out\
          Copy-Item "$($crt.FullName)\vcruntime140_1.dll" vcrt-out\
          Get-ChildItem vcrt-out | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: vcrt-dlls
          path: vcrt-out
