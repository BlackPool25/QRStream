name: diag-vcrt
on: workflow_dispatch
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate + copy MSVC CRT DLLs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          $redistRoot = "$vsPath\VC\Redist\MSVC"
          Write-Host "RedistRoot: $redistRoot exists=$(Test-Path $redistRoot)"
          # Find the directory that holds msvcp140.dll under the redist root
          $msvcp = Get-ChildItem $redistRoot -Recurse -Filter "msvcp140.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          Write-Host "msvcp140.dll: $($msvcp.FullName)"
          $dir = $msvcp.DirectoryName
          New-Item -ItemType Directory -Force -Path vcrt-out | Out-Null
          Copy-Item "$dir\msvcp140.dll" vcrt-out\
          Get-ChildItem $dir -Filter "vcruntime140*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName vcrt-out\
            Write-Host "copied $($_.Name)"
          }
          Get-ChildItem vcrt-out | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: vcrt-dlls
          path: vcrt-out
